[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdraw-alphagenome-env"
version = "0.1.0"
description = "Isolated runtime for Deepdraw AlphaGenome embedding extraction"
requires-python = ">=3.11,<3.12"
dependencies = [
    "deepdraw-opt[alphagenome]",
    "alphagenome_research",
    "jax[cuda12]>=0.6.0; platform_system == 'Linux'",
]

[tool.uv]
package = false

[tool.uv.sources]
deepdraw-opt = { path = "../..", editable = true }
alphagenome_research = { git = "https://github.com/google-deepmind/alphagenome_research.git", rev = "dad09dd11a480fb8c16ae703a606f55a6e3e968b" }
